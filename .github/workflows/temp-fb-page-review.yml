name: Temporary Page source review
on:
  push:
    branches: [codex/fb-page-review2-1123]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RENDER_TAG: fb-page-review2-1123
      RENDER_ID: '455110583'
    steps:
      - name: Fetch private temporary media
        shell: bash
        run: |
          RENDER_ASSET=$(gh api "repos/$GH_REPO/releases/$RENDER_ID/assets" --jq '.[] | select(.name=="render-input.tar") | .id')
          gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$RENDER_ASSET" > /tmp/render-input.tar
          sudo mkdir -p /home/luke/hmw-content
          sudo chown -R "$(id -u):$(id -g)" /home/luke
          tar -xf /tmp/render-input.tar -C /
      - name: Prepare existing renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /tmp/ffmpeg-install.log 2>&1
          python3 -m venv /tmp/render-env
          /tmp/render-env/bin/pip install --quiet "faster-whisper==1.2.1" "av==14.2.0" "pillow"
          ffmpeg -version
      - name: Review two source clips using existing FFmpeg tools and independent VAD
        run: |
          RENDER_CORE=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout 780 taskset -c "$RENDER_CORE" nice -n 19 /tmp/render-env/bin/python /home/luke/hmw-content/_work/facebook_hourly_20261122/hosted_review2/run.py
      - name: Retain private output for review
        if: always()
        run: |
          python3 - <<'PACK'
          from pathlib import Path
          import tarfile
          p=Path('/home/luke/hmw-content/_work/facebook_hourly_20261122/hosted_review2')
          names=[str(f.relative_to(p)) for f in (p/'out').rglob('*') if f.is_file() and f.suffix in ('.json','.jpg','.png')]
          with tarfile.open('/tmp/render-output.tar','w') as t:
              for name in names:
                  f=p/name
                  if f.is_file(): t.add(f,arcname=name,recursive=False)
          PACK
          gh release upload "$RENDER_TAG" /tmp/render-output.tar --repo "$GH_REPO" --clobber

# Existing FFmpeg toolkit; two Page sources and a known speech control.
