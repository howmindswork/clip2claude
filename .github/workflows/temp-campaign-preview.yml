name: Owned original story pilot
on:
  push:
    branches: [codex/youtube-original-1122]
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RENDER_TAG: youtube-original-pilot-20261122
      RENDER_ID: '454956357'
      HYPERFRAMES_CLI: /tmp/render-runtime/node_modules/.bin/hyperframes
      HYPERFRAMES_BROWSER_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'
      - name: Fetch authenticated draft input
        run: |
          RENDER_ASSET=$(gh api "repos/$GH_REPO/releases/$RENDER_ID/assets" --jq '.[] | select(.name=="render-input.tar") | .id')
          gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$RENDER_ASSET" > /tmp/render-input.tar
          sudo mkdir -p /home/luke/hmw-content
          sudo chown -R "$(id -u):$(id -g)" /home/luke
          tar -xf /tmp/render-input.tar -C /
          mkdir -p /home/luke/hmw-content/_work/youtube_original_20261122/{qa,deliver}
      - name: Prepare pinned incumbent runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /tmp/ffmpeg-install.log 2>&1
          npm install --prefix /tmp/render-runtime --no-audit --no-fund hyperframes@0.9.13 > /tmp/npm-install.log 2>&1
          node --version
          "$HYPERFRAMES_CLI" --version
          /usr/bin/google-chrome --version
      - name: Inspect source and prove20second scene using one CPU
        run: |
          RENDER_CORE=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout 660 taskset -c "$RENDER_CORE" nice -n 19 bash /home/luke/hmw-content/_work/youtube_original_20261122/run_short1_preview.sh
      - name: Retain authenticated draft proof and diagnostics
        if: always()
        run: |
          python3 - <<'PACK'
          from pathlib import Path
          import tarfile
          p=Path('/home/luke/hmw-content/_work/youtube_original_20261122')
          files=[x for folder in ['qa','deliver'] for x in (p/folder).rglob('*') if x.is_file()]
          files += [x for x in (p/'research').glob('source_contact*') if x.is_file()]
          files += [x for x in (p/'short1/.hyperframes/artifacts/snapshots').rglob('*.png') if x.is_file()]
          with tarfile.open('/tmp/render-output.tar','w') as t:
            for x in files:t.add(x,arcname=str(x.relative_to(p)),recursive=False)
          PACK
          gh release upload "$RENDER_TAG" /tmp/render-output.tar --repo "$GH_REPO" --clobber

